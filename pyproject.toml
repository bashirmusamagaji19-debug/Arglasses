[project]
name = "ai-glasses-memory"
version = "0.1.0"
description = "AI 眼镜实时视觉记忆助手"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "streamlit>=1.36.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "chromadb>=0.5.0",
    "kubernetes==35.0.0",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]
ocr = [
    "paddleocr==3.6.0",
]
embedding = [
    "sentence-transformers>=3.0.0",
    "torchvision==0.27.0",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
